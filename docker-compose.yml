services:
  pr-copilot:
    build: .
    image: pr-copilot:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # without .env (no ANTHROPIC_API_KEY) the app starts in demo mode
    environment:
      PRCOPILOT_DB: /data/pr_copilot.db
    volumes:
      - pr-copilot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pr-copilot-data:
