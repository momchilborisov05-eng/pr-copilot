name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      PRCOPILOT_MODE: demo          # tests never call the Claude or GitHub APIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
          coverage xml
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pr-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait for /healthz
        run: |
          docker run -d --name prc -p 8000:8000 pr-copilot:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS -X POST http://localhost:8000/api/demo/run -H 'content-type: application/json' -d '{}' | grep -q '"status":"completed"'
          test "$(docker inspect -f '{{.Config.User}}' prc)" = "app"
      - if: always()
        run: docker logs prc || true

  deploy:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Summary
        run: echo "Published \`${{ env.IMAGE }}:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
